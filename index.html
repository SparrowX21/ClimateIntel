    <noscript>
      <div style="max-width: 720px; margin: 60px auto; padding: 24px; font-family: system-ui, sans-serif; line-height: 1.6;">
        <h1>ClimateIntel — Climate Stress Score for Any US Location</h1>
        <p>ClimateIntel is a free, real-time climate risk analysis tool for the contiguous United States. Click any US location and get a 0-1 climate stress score across four independent dimensions: heat, water, ecological, and urban density stress.</p>
        <p>Each dimension is scored by its own XGBoost machine learning model trained on 5,707 CONUS-wide samples of MODIS satellite data (land surface temperature, vegetation index), TerraClimate precipitation and vapor pressure deficit, USGS NLCD landcover, and gridded population density. A Gemini AI layer then interprets the raw satellite readings and generates location-specific policy recommendations.</p>
        <p>This app requires JavaScript to run. Please enable JavaScript in your browser.</p>
      </div>
