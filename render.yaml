services:
  # ── Flask API (Python + Earth Engine + Gemini + XGBoost) ────
  - type: web
    name: climateintel-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/model-info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEE_PROJECT_ID
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FLASK_DEBUG
        value: "0"

  # ── React frontend (Vite static site) ────────────────────────
  - type: web
    name: climateintel-web
    runtime: static
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: climateintel-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
